<!DOCTYPE html>
<!-- BY; CUCUMBE -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mmadunna</title>

<link rel="icon" type="image/jpeg" href="https://github.com/iavitadumitru56-ai/Persistence.github.io/blob/main/LOGO.jpg?raw=true">
<link rel="apple-touch-icon" href="https://github.com/iavitadumitru56-ai/Persistence.github.io/blob/main/LOGO.jpg?raw=true">

<style>
* {
    cursor: url("https://github.com/iavitadumitru56-ai/Persistence.github.io/blob/main/cursor.png?raw=true") 16 16, auto !important;
}
</style>

<style>
:root {
    --main: #5c4f67;
    --second: #352536;
    --accent: #f5b6ff;
    --text: #ffffff;
    --gradient-start: #c5adda;
    --gradient-end: #b845c8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(ellipse at 50% 45%, #49334e 0%, transparent 65%),
        linear-gradient(145deg, #17121c, #241927 55%, #130f18);
    color: var(--text);
    font-family: "Trebuchet MS", cursive, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        circle at 50% 35%,
        rgba(245, 182, 255, 0.09),
        transparent 65%
    );
}

.container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 60px;
    position: relative;
}

.chandelier {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    margin-bottom: 24px;
    z-index: 2;
    -webkit-tap-highlight-color: transparent;
}

.chain {
    width: 2px;
    height: 65px;
    background: linear-gradient(
        to bottom,
        #8c7395,
        var(--accent)
    );
    box-shadow: 0 0 8px #f5b6ff66;
}

.chandelier svg {
    width: 180px;
    height: 115px;
    overflow: visible;
    filter: drop-shadow(0 0 12px #e8a5ff55);
    transition: 0.4s ease;
}

.chandelier:hover svg {
    filter: drop-shadow(0 0 24px #f5b6ffcc);
    transform: scale(1.06);
}

.chandelier:active svg {
    transform: scale(0.94);
}

.light {
    fill: #f5b6ff;
    filter: drop-shadow(0 0 8px #f5b6ff);
}

.chandelier-glow {
    position: absolute;
    width: 220px;
    height: 130px;
    bottom: -15px;
    background: radial-gradient(
        ellipse,
        #e7a4ff20,
        transparent 70%
    );
    pointer-events: none;
}

.title {
    font-size: clamp(35px, 7vw, 65px);
    font-weight: 800;
    letter-spacing: 5px;
    margin: 0 0 30px;
    opacity: 0;
    transform: translateY(20px);
    background: linear-gradient(
        90deg,
        var(--gradient-start),
        var(--accent),
        var(--gradient-end)
    );
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 15px #d58bff55);
    transition: 0.8s ease;
}

.title.show {
    opacity: 1;
    transform: translateY(0);
}

.video-wrapper {
    width: min(420px, 90vw);
    position: relative;
    padding: 7px;
    border-radius: 18px;
    background: linear-gradient(
        135deg,
        #c5adda,
        #b845c8,
        #5c4f67
    );
    box-shadow:
        0 0 25px #b845c833,
        0 0 80px #b845c81c;
}

.video-inner {
    width: 100%;
    overflow: hidden;
    border-radius: 13px;
    background: #17121c;
    aspect-ratio: 174 / 244;
}

video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Compact pink-purple mini music player */
.audio-player {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 20;
    width: min(310px, calc(100vw - 32px));
    padding: 11px 13px 10px;
    border: 1px solid #f5b6ff66;
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(53, 37, 54, .94), rgba(23, 18, 28, .94));
    box-shadow: 0 9px 30px #0008, 0 0 24px #b845c822;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: border-color .28s ease, box-shadow .28s ease, transform .28s ease;
}

.audio-player:hover,
.audio-player:focus-within {
    border-color: #f5b6ffbb;
    box-shadow: 0 12px 34px #0009, 0 0 30px #b845c844;
    transform: translateY(-2px);
}

.player-main {
    display: flex;
    align-items: center;
    gap: 10px;
}

.music-toggle {
    flex: 0 0 36px;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid #f5b6ff88;
    border-radius: 50%;
    background: linear-gradient(145deg, #765f80, #352536);
    color: #f5b6ff;
    cursor: pointer;
    box-shadow: inset 0 0 12px #f5b6ff12, 0 0 12px #b845c822;
    transition: transform .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease, background .22s ease;
}

.music-toggle:hover {
    transform: scale(1.08);
    color: #fff;
    border-color: #f5b6ff;
    background: linear-gradient(145deg, #9475a0, #513956);
    box-shadow: 0 0 18px #f5b6ff66;
}

.music-toggle:active {
    transform: scale(.94);
}

.music-toggle svg {
    display: block;
    width: 15px;
    height: 15px;
    fill: currentColor;
}

.music-toggle:focus-visible,
.music-volume:focus-visible,
.music-seek:focus-visible {
    outline: 2px solid #f5b6ff;
    outline-offset: 3px;
}

.player-track {
    min-width: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.player-track-name {
    overflow: hidden;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    line-height: 1.15;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.player-track-state {
    color: #c5adda99;
    font-size: 9px;
    letter-spacing: 1.5px;
    line-height: 1.2;
    text-transform: uppercase;
}

.player-volume {
    flex: 0 0 83px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.player-volume svg {
    flex: 0 0 13px;
    width: 13px;
    height: 13px;
    fill: #c5adda;
}

.music-volume,
.music-seek {
    --volume-fill: 35%;
    min-width: 0;
    width: 100%;
    height: 4px;
    margin: 0;
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #f5b6ff 0%, #b845c8 var(--volume-fill), #ffffff30 var(--volume-fill), #ffffff30 100%);
    cursor: pointer;
}

.music-volume::-webkit-slider-runnable-track,
.music-seek::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: transparent;
}

.music-volume::-moz-range-track,
.music-seek::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: transparent;
}

.music-volume::-webkit-slider-thumb,
.music-seek::-webkit-slider-thumb {
    width: 10px;
    height: 10px;
    margin-top: -3px;
    appearance: none;
    -webkit-appearance: none;
    border: 2px solid #352536;
    border-radius: 50%;
    background: #f5b6ff;
    box-shadow: 0 0 0 1px #f5b6ff, 0 0 10px #f5b6ff77;
    transition: transform .18s ease, box-shadow .18s ease;
}

.music-volume::-moz-range-thumb,
.music-seek::-moz-range-thumb {
    width: 8px;
    height: 8px;
    border: 2px solid #352536;
    border-radius: 50%;
    background: #f5b6ff;
    box-shadow: 0 0 0 1px #f5b6ff, 0 0 10px #f5b6ff77;
    transition: transform .18s ease, box-shadow .18s ease;
}

.music-volume:hover::-webkit-slider-thumb,
.music-seek:hover::-webkit-slider-thumb {
    transform: scale(1.2);
    box-shadow: 0 0 0 1px #f5b6ff, 0 0 15px #f5b6ffbb;
}

.music-volume:hover::-moz-range-thumb,
.music-seek:hover::-moz-range-thumb {
    transform: scale(1.2);
    box-shadow: 0 0 0 1px #f5b6ff, 0 0 15px #f5b6ffbb;
}

.player-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
}

.music-seek {
    flex: 1 1 auto;
    --volume-fill: 0%;
}

.music-seek:disabled {
    cursor: default;
    opacity: .45;
}

.player-time {
    flex: 0 0 30px;
    color: #c5adda99;
    font-size: 9px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-align: center;
}

@media(max-width: 600px) {
    .audio-player {
        left: 12px;
        bottom: 12px;
        width: min(310px, calc(100vw - 24px));
    }
}

.bottom-glow {
    position: fixed;
    width: 500px;
    height: 250px;
    bottom: -200px;
    background: #b845c8;
    filter: blur(110px);
    opacity: 0.2;
    pointer-events: none;
}

.hint {
    color: #c5adda88;
    font-size: 12px;
    letter-spacing: 3px;
    margin-top: 25px;
    text-transform: uppercase;
}

@media(max-width: 600px) {
    .chain {
        height: 50px;
    }

    .chandelier svg {
        width: 145px;
        height: 95px;
    }

    .container {
        justify-content: center;
    }

    .title {
        letter-spacing: 3px;
    }
}

.content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 35px;
    width: 100%;
    max-width: 1050px;
}

.video-wrapper {
    width: 300px;
    flex-shrink: 0;
}

.script-card {
    width: 350px;
    padding: 10px;
    border-radius: 18px;
    background: linear-gradient(
        145deg,
        #5c4f67,
        #352536
    );
    border: 1px solid #f5b6ff44;
    box-shadow: 0 0 30px #b845c822;
    text-align: center;
    transition: 0.3s ease;
	display: block;
	text-decoration: none;
	color: inherit;
	cursor: pointer;
}

.script-card:focus-visible {
    outline: 2px solid #f5b6ff;
    outline-offset: 5px;
}

.script-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 35px #b845c855;
}

.script-image {
    width: 100%;
    overflow: hidden;
    border-radius: 12px;
    background: #17121c;
}

.script-image img {
    display: block;
    width: 100%;
    height: auto;
    transition: 0.4s ease;
}

.script-card:hover img {
    transform: scale(1.025);
}

.script-title {
    margin-top: 15px;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 3px;
    background: linear-gradient(
        90deg,
        #c5adda,
        #f5b6ff,
        #b845c8
    );
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}

.script-subtitle {
    margin-top: 7px;
    margin-bottom: 8px;
    color: #c5adda88;
    font-size: 11px;
    letter-spacing: 2px;
}

@media(max-width: 750px) {
    .content {
        flex-direction: column;
        gap: 25px;
    }

    .video-wrapper {
        width: min(300px, 85vw);
    }

    .script-card {
        width: min(350px, 90vw);
    }
}

.intro-curtain {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;

    background:
        radial-gradient(circle at 50% 45%, #b845c855, transparent 45%),
        linear-gradient(135deg, #352536, #5c4f67);

    transition:
        transform 1.1s cubic-bezier(.77, 0, .18, 1),
        opacity 5s ease;
}

.intro-curtain.open {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
}

.curtain-content {
    text-align: center;
    animation: curtainPulse 2s ease-in-out infinite;
}

.curtain-title {
    font-size: clamp(35px, 7vw, 65px);
    font-weight: 800;
    letter-spacing: 9px;

    background: linear-gradient(
        90deg,
        #c5adda,
        #f5b6ff,
        #b845c8
    );

    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;

    text-shadow: 0 0 35px #b845c855;
}

.curtain-subtitle {
    margin-top: 12px;
    color: #f5b6ff99;
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

@keyframes curtainPulse {
    0%, 100% {
        transform: scale(1);
        opacity: 0.85;
    }
    50% {
        transform: scale(1.04);
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="intro-curtain" id="introCurtain">
    <div class="curtain-content">
        <div class="curtain-title">CLICK ME</div>
        <div class="curtain-subtitle">click to enter</div>
    </div>
</div>

<div class="container">

    <div class="chandelier" id="chandelier">
        <div class="chain"></div>

        <svg viewBox="0 0 200 120" fill="none"
             xmlns="http://www.w3.org/2000/svg">

            <path d="M100 0 V12"
                  stroke="#c5adda" stroke-width="2"/>

            <path d="M85 13 Q100 23 115 13"
                  stroke="#c5adda" stroke-width="2"/>

            <path d="M100 17 V66"
                  stroke="#c5adda" stroke-width="2"/>

            <path d="M100 34 Q70 34 55 53"
                  stroke="#c5adda" stroke-width="2"/>

            <path d="M100 34 Q130 34 145 53"
                  stroke="#c5adda" stroke-width="2"/>

            <path d="M55 53 Q35 60 25 78"
                  stroke="#c5adda" stroke-width="2"/>

            <path d="M145 53 Q165 60 175 78"
                  stroke="#c5adda" stroke-width="2"/>

            <path d="M100 66 Q75 68 65 90"
                  stroke="#c5adda" stroke-width="2"/>

            <path d="M100 66 Q125 68 135 90"
                  stroke="#c5adda" stroke-width="2"/>

            <circle class="light" cx="25" cy="80" r="5"/>
            <circle class="light" cx="175" cy="80" r="5"/>
            <circle class="light" cx="55" cy="55" r="5"/>
            <circle class="light" cx="145" cy="55" r="5"/>
            <circle class="light" cx="65" cy="93" r="5"/>
            <circle class="light" cx="135" cy="93" r="5"/>

            <path d="M25 85 V99 M175 85 V99
                     M65 98 V110 M135 98 V110"
                  stroke="#c5adda" stroke-width="1.5"/>

            <path d="M20 99 Q25 106 30 99
                     M170 99 Q175 106 180 99
                     M60 110 Q65 117 70 110
                     M130 110 Q135 117 140 110"
                  stroke="#f5b6ff" stroke-width="1.5"/>
        </svg>

        <div class="chandelier-glow"></div>
    </div>

    <h1 class="title" id="title">mmadunna</h1>

    <div class="content">
        <div class="video-wrapper">
            <div class="video-inner">
                <video autoplay muted loop playsinline>
                    <source
                        src="https://github.com/iavitadumitru56-ai/Persistence.github.io/raw/refs/heads/main/KOGDA.mp4"
                        type="video/mp4">
                </video>
            </div>
        </div>

        <a
            class="script-card"
            href="https://example.com"
            aria-label="Open script website"
        >
            <div class="script-image">
                <img
                    src="https://github.com/iavitadumitru56-ai/Persistence.github.io/raw/refs/heads/main/menu.png"
                    alt="Script Menu"
                >
            </div>
        
            <div class="script-title">SCRIPT MENU</div>
            <div class="script-subtitle">Click to open</div>
        </a>
    </div>

    <div class="hint">click the chandelier</div>
</div>

<section class="audio-player" role="group" aria-label="Music player">
    <div class="player-main">
        <button class="music-toggle" id="musicToggle" type="button" aria-label="Play music" title="Play music">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <div class="player-track">
            <span class="player-track-name">MILLIONAIRES</span>
            <span class="player-track-state" id="playerTrackState">Now playing</span>
        </div>

        <div class="player-volume">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>

            <input class="music-volume" id="musicVolume" type="range" min="0" max="100" step="1" value="35" aria-label="Music volume" title="Volume">
        </div>
    </div>

    <div class="player-progress">
        <span class="player-time" id="musicCurrentTime">0:00</span>

        <input class="music-seek" id="musicSeek" type="range" min="0" max="1000" step="1" value="0" aria-label="Playback position" title="Playback position" disabled>

        <span class="player-time" id="musicDuration">0:00</span>
    </div>
</section>

<audio id="backgroundMusic" preload="auto" loop>
    <source src="https://raw.githubusercontent.com/iavitadumitru56-ai/Persistence.github.io/refs/heads/main/Millionaires.mp3" type="audio/mpeg">
</audio>

<div class="bottom-glow"></div>

<script>
const chandelier = document.getElementById("chandelier");
const title = document.getElementById("title");
const introCurtain = document.getElementById("introCurtain");
const backgroundMusic = document.getElementById("backgroundMusic");
const musicToggle = document.getElementById("musicToggle");
const musicVolume = document.getElementById("musicVolume");
const musicSeek = document.getElementById("musicSeek");
const musicCurrentTime = document.getElementById("musicCurrentTime");
const musicDuration = document.getElementById("musicDuration");
const playerTrackState = document.getElementById("playerTrackState");

const playIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const pauseIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

let hasEntered = false;

backgroundMusic.volume = 0.35;
backgroundMusic.loop = true;

function updateMusicButton() {
    const playing = !backgroundMusic.paused;

    musicToggle.innerHTML = playing ? pauseIcon : playIcon;
    musicToggle.setAttribute("aria-label", playing ? "Pause music" : "Play music");
    musicToggle.title = playing ? "Pause music" : "Play music";
}

function formatMusicTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const remaining = Math.floor(seconds % 60);

    return minutes + ":" + String(remaining).padStart(2, "0");
}

function updateMusicVolume() {
    const volume = Number(musicVolume.value);

    backgroundMusic.volume = volume / 100;
    musicVolume.style.setProperty("--volume-fill", volume + "%");
}

function updateMusicProgress() {
    const duration = backgroundMusic.duration;
    const current = backgroundMusic.currentTime || 0;
    const hasDuration = Number.isFinite(duration) && duration > 0;

    musicSeek.disabled = !hasDuration;

    if (hasDuration) {
        const position = current / duration * 1000;

        musicSeek.value = String(position);
        musicSeek.style.setProperty("--volume-fill", (position / 10) + "%");
        musicDuration.textContent = formatMusicTime(duration);
    } else {
        musicSeek.value = "0";
        musicSeek.style.setProperty("--volume-fill", "0%");
        musicDuration.textContent = "0:00";
    }

    musicCurrentTime.textContent = formatMusicTime(current);
}

async function toggleMusic() {
    if (!hasEntered) return;

    if (backgroundMusic.paused) {
        try {
            await backgroundMusic.play();
        } catch (error) {
            console.error("Music could not be started:", error);
        }
    } else {
        backgroundMusic.pause();
    }

    updateMusicButton();
}

chandelier.addEventListener("click", () => {
    title.classList.add("show");
    navigator.clipboard.writeText("mmadunna").catch(() => {});
});

introCurtain.addEventListener("click", () => {
    if (hasEntered) return;

    hasEntered = true;
    introCurtain.classList.add("open");

    backgroundMusic.play().catch(error => {
        console.error("Music could not be started:", error);
        updateMusicButton();
    });
});

musicToggle.addEventListener("click", toggleMusic);

musicVolume.addEventListener("input", updateMusicVolume);

musicSeek.addEventListener("input", () => {
    if (!Number.isFinite(backgroundMusic.duration) || backgroundMusic.duration <= 0) return;

    backgroundMusic.currentTime = Number(musicSeek.value) / 1000 * backgroundMusic.duration;
    updateMusicProgress();
});

backgroundMusic.addEventListener("loadedmetadata", updateMusicProgress);
backgroundMusic.addEventListener("durationchange", updateMusicProgress);
backgroundMusic.addEventListener("timeupdate", updateMusicProgress);

backgroundMusic.addEventListener("play", () => {
    updateMusicButton();
    playerTrackState.textContent = "Now playing";
});

backgroundMusic.addEventListener("pause", () => {
    updateMusicButton();
    playerTrackState.textContent = "Paused";
});

backgroundMusic.addEventListener("error", () => {
    console.error("Music file failed to load:", backgroundMusic.error);
});

let tabTitleLength = 0;
let deletingTabTitle = false;
const tabTitleText = "mmadunna";

function animateTabTitle() {
    document.title = tabTitleLength === 0
        ? "\u200B"
        : tabTitleText.slice(0, tabTitleLength);

    let delay = 150;

    if (!deletingTabTitle && tabTitleLength < tabTitleText.length) {
        tabTitleLength++;
    } else if (!deletingTabTitle) {
        deletingTabTitle = true;
        delay = 1100;
    } else if (tabTitleLength > 0) {
        tabTitleLength--;
        delay = 90;
    } else {
        deletingTabTitle = false;
        delay = 450;
    }

    window.setTimeout(animateTabTitle, delay);
}

updateMusicVolume();
updateMusicButton();
updateMusicProgress();
animateTabTitle();
</script>

</body>
</html>
